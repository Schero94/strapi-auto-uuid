# Checks every pull request, every push to main and manual runs: lint,
# formatting, tests (including the SQLite lifecycle and repair suites), the
# admin StrictMode tests (also against React 19, informational), build
# and package verification on every Node major in engines.node (Strapi 5.63
# supports 22 to 26), plus tests and build against the oldest Strapi the
# peerDependencies allow.
name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  # Cancel superseded PR runs, but let every run on main finish so the badge
  # always reflects the latest commit.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24', '26']
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install dependencies (no lifecycle scripts)
        run: npm ci --ignore-scripts
      - name: Lint
        run: npm run lint
      - name: Format check
        run: npm run format:check
      - name: Tests
        run: npm test
      - name: Admin StrictMode tests (React 18)
        run: npm run test:admin
      - name: Build
        run: npm run build
      - name: Verify package
        run: npm run verify
      - name: Package contents
        run: npm pack --dry-run
      - name: Production audit (critical)
        run: npm audit --omit=dev --audit-level=critical

  # Informational: the peer range is React ^18, like the Strapi 5 admin, and
  # stays so. This job runs the admin StrictMode tests against React 19 (RFC
  # strapi/strapi#25739) to see problems before Strapi moves; a failure here
  # does not block a pull request.
  react-19:
    name: Admin StrictMode tests on React 19 (informational)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies (no lifecycle scripts)
        run: npm ci --ignore-scripts
      # React 19 is outside the peer range on purpose: plain npm refuses it and
      # --force drops packages from the tree, so this one step skips the peer
      # check (tests/ci-contract.test.js allows exactly this line).
      - name: Install React 19 (not saved)
        run: npm install --no-save --legacy-peer-deps --ignore-scripts react@19 react-dom@19
      - name: Show installed React version
        run: node -p "'react ' + require('react/package.json').version + ', react-dom ' + require('react-dom/package.json').version"
      - name: Admin StrictMode tests (React 19)
        run: npm run test:admin

  # peerDependencies allow @strapi/strapi ^5.24.0: run the tests and the build
  # against that floor, not only against the devDependency version. Strapi
  # 5.24 supports Node 22 at most. npm marks 5.24.0 and 5.24.1 deprecated
  # (build issue), so the job uses 5.24.2, the oldest usable release of the
  # floor's minor version (tests/ci-contract.test.js checks the minor).
  strapi-floor:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      STRAPI_FLOOR: 5.24.2
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies (no lifecycle scripts)
        run: npm ci --ignore-scripts
      - name: Install the Strapi peer floor
        run: >-
          npm install --no-save --ignore-scripts --no-audit --no-fund
          "@strapi/strapi@$STRAPI_FLOOR" "@strapi/database@$STRAPI_FLOOR" "@strapi/utils@$STRAPI_FLOOR"
      - name: Show the installed Strapi versions
        run: npm ls @strapi/strapi @strapi/database @strapi/utils --depth=0 || true
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build

  # Several Strapi processes on one database (Railway replicas, pm2 cluster):
  # the PostgreSQL lock and rate-limit tests plus the 8-process race on
  # SQLite and PostgreSQL. Synthetic data, local service container only.
  multi-instance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: strapi
          POSTGRES_DB: auto_uuid_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U strapi -d auto_uuid_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AUTO_UUID_PG_URL: postgres://strapi@127.0.0.1:5432/auto_uuid_test
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies (no lifecycle scripts)
        run: npm ci --ignore-scripts
      - name: Tests including PostgreSQL
        run: npm test
      - name: 8 processes on SQLite
        run: npm run test:concurrency -- --client sqlite
      - name: 8 processes on PostgreSQL
        run: npm run test:concurrency -- --client postgres
